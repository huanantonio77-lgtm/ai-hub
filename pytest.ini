[pytest]
# ai-hub pytest config (s201)
# Excludes auto-generated draft tests under self/curator/drafts/
# (archive of past sessions; duplicate basenames break collection).

testpaths = arbitrage_bot/tests tests
addopts = --ignore=self/curator/drafts -q --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestCollectionWarning
